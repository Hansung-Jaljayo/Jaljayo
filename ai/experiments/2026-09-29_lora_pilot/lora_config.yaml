# 두 조건 공통 설정. 바뀌는 것은 data와 adapter_path뿐이다
model: model/Llama-3.2-1B-Instruct-bf16
train: true
fine_tune_type: lora
num_layers: 16
batch_size: 4
learning_rate: 5.0e-5
max_seq_length: 256
seed: 0
steps_per_report: 10
steps_per_eval: 100000
val_batches: 8
save_every: 100000
grad_checkpoint: false
lora_parameters:
  rank: 8
  scale: 20.0
  dropout: 0.0
