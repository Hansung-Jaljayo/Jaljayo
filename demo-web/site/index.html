<canvas id="view" aria-label="접히는 모션베드가 있는 호텔 침실"></canvas><div class="brand"><h1>잘자요</h1><p>편안함이 움직이는 공간</p></div><div class="badge">SUNLIT · 16:30</div>
<div class="ring-overlay" id="ring-overlay" aria-hidden="true" hidden></div><section class="remote" aria-label="침대 조작판"><nav class="rail" aria-label="조작 메뉴"><span class="remote-mark"><img src="./fig-moon.svg?v=4" alt="잘자요" width="16" height="28" style="display:block"></span><button data-tab="talk" aria-selected="true">말하기</button><button data-tab="pose" aria-selected="false">자세</button><button data-tab="device" aria-selected="false">기기</button><button id="stop" class="stop">멈춤</button></nav>

<div class="console"><div class="console-top"><span class="title">가정용 침대</span><span id="motion-status">멈춤</span></div>
<div id="pose-pane" class="pane" hidden><h2>각도 조절</h2><div class="sliders"><div class="sliderline"><label for="head">머리</label><button data-jog="head,-1" aria-label="머리 내리기">−</button><input id="head" type="range" min="0" max="60" value="0"><button data-jog="head,1" aria-label="머리 올리기">+</button><output id="hv">0°</output></div><div class="sliderline"><label for="leg">다리</label><button data-jog="leg,-1" aria-label="다리 내리기">−</button><input id="leg" type="range" min="0" max="40" value="0"><button data-jog="leg,1" aria-label="다리 올리기">+</button><output id="lv">0°</output></div></div><h2>저장 자세<span class="pose-mode-hint" id="pose-mode-hint"></span></h2><div class="presets" id="presets"><button data-purpose="read" data-label="독서"><b>독서</b><small id="pose-read"></small></button><button data-purpose="tv" data-label="TV"><b>TV 시청</b><small id="pose-tv"></small></button><button data-purpose="rest" data-label="휴식"><b>휴식</b><small id="pose-rest"></small></button><button data-purpose="sleep" data-label="수면"><b>수면 · 평평하게</b><small id="pose-sleep"></small></button></div><div class="pose-tools"><button id="pose-save" aria-pressed="false">지금 각도로 저장</button><button id="pose-reset" aria-pressed="false">처음 값으로 되돌리기</button></div></div>
<div id="talk-pane" class="pane"><div id="talk-items"></div></div>
<div id="device-pane" class="pane" hidden><div class="device-state" id="device-state"></div><div class="device-actions"><button id="alarm">알람 시각이 됨</button><button id="alarm-off">알람 끄기</button><button id="reservation">예약 시각이 됨</button></div><details class="more"><summary>상세 설정</summary><div class="device-actions"><button id="occupied">침대에서 나가기</button><button id="pillows" aria-pressed="true">베개</button><label><input id="motor" type="checkbox">모터 소리</label><label><input id="lift" type="checkbox">알람 때 상체 올림</label></div></details></div>
<div class="feedback" aria-live="polite"><span id="heard">시연 모드 · 예시 문장으로 조작</span><strong id="reply">원하는 자세를 골라 주세요</strong><span id="confirm-actions" hidden><button id="confirm-yes">예</button><button id="confirm-no">아니오</button></span></div>

<div class="pressure-state" id="pressure-state" aria-live="polite">센서 값 기다리는 중</div>

<div class="pressure-nums"><span>눌림 <b id="pressure-value">0</b></span><span>기준 <b id="pressure-line-value">300</b></span></div>
